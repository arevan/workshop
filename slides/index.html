<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Слайды — вайбкодинг для дизайнеров</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="%23161616"/><rect x="30" y="30" width="40" height="40" rx="8" fill="%23FFDD2D"/></svg>'>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/slides.css">
</head>
<body class="slides-page">
  <!-- Живой фон: сетка точек, расходится под курсором (js/dots.js) -->
  <canvas id="dots" aria-hidden="true"></canvas>

  <!-- Сюда движок кладёт слайды. Контент — в /content/slides/*.md -->
  <main id="stage" class="stage" aria-live="polite"></main>

  <!-- Служебная обвязка: возврат, прогресс, счётчик, подсказка, заметки.
       Ссылка назад показывается только когда двигают мышью — чтобы
       не мозолить глаза на проекторе. -->
  <a class="slides-home" href="../index.html">← Воркшоп</a>
  <div class="progress"><b id="bar"></b></div>
  <div id="counter" class="counter"></div>
  <div id="hint" class="hint">→ или пробел — дальше&ensp;·&ensp;F — во весь экран&ensp;·&ensp;N — заметки</div>
  <div id="notes" class="notes"></div>

  <script src="../js/dots.js"></script>
  <script src="../js/md.js"></script>
  <script src="../js/content.js"></script>
  <script src="../js/slides.js"></script>
</body>
</html>
